service challenge
{
    disable         = no
    socket_type     = stream
    protocol        = tcp
    port            = 8000
    wait            = no
    user            = ctf
    server          = /home/ctf/chall
    type            = UNLISTED
    banner_fail     = /etc/issue
    log_on_failure  += USERID
    flags           = REUSE
}
